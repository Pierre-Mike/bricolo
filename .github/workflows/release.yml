name: release

# Pushing a tag v* builds the packages and attaches them to a GitHub
# release named after the tag. See docs/install.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # bricolo.app with bricolo inside, signed ad-hoc (CI has no signing
  # identity), zipped with ditto so the signature survives.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli
      - name: Build and sign the app
        env:
          BRICOLO_SIGN_IDENTITY: "-"
        run: scripts/bundle-macos.sh
      - name: Zip it
        run: |
          mkdir -p dist
          ditto -c -k --keepParent target/bundle/bricolo.app \
            "dist/bricolo-${GITHUB_REF_NAME#v}-macos-arm64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  # bricolo tarballs, built on Debian bookworm like `just bundle-linux`, so they
  # run on glibc 2.36 and later.
  linux:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    container: rust:1-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Install the toolchain
        run: rustup toolchain install
      - name: Build the tarball
        run: bash scripts/bundle-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.runner }}
          path: dist/*

  # bricolo-ui as a .deb (with bricolo in /usr/bin) and an AppImage, on x86_64.
  linux-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri's Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libxdo-dev libssl-dev build-essential pkg-config file
      - name: Install the toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli
      - name: Build bricolo, then bricolo-ui's .deb and AppImage
        run: |
          cargo build --release -p bricolo-node
          cd crates/ui
          cargo tauri build --bundles deb,appimage --ci \
            --config '{"bundle":{"linux":{"deb":{"files":{"/usr/bin/bricolo":"../../target/release/bricolo"}}}}}'
          mkdir -p ../../dist
          cp ../../target/release/bundle/deb/*.deb ../../target/release/bundle/appimage/*.AppImage ../../dist/
      - uses: actions/upload-artifact@v4
        with:
          name: linux-ui
          path: dist/*

  release:
    needs: [macos, linux, linux-ui]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
