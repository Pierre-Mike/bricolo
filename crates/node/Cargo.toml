[package]
name = "bricolo-node"
description = "The bricolo node and its `bricolo` command line."
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "bricolo"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
clap.workspace = true
notify.workspace = true
bricolo-lua.workspace = true
bricolo-mcp.workspace = true
bricolo-mesh.workspace = true
bricolo-providers.workspace = true
bricolo-router.workspace = true
bricolo-runtime.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
toml_edit.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true

[target.'cfg(unix)'.dependencies]
# getuid, for launchctl's gui/<uid> domain.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# The control pipe's security descriptor: only this user may connect.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile.workspace = true
