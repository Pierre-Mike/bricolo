[package]
name = "touch-id"
version = "0.1.0"
edition = "2024"
publish = false
description = "Opens the macOS Touch ID prompt for the password-typer plugin."

# The objc2 bindings for LocalAuthentication (MIT). Elsewhere the server
# builds with the standard library only and answers 503.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-local-authentication = "0.3.2"

# Its own workspace, so it builds wherever it sits.
[workspace]

[profile.release]
opt-level = 3
strip = true
